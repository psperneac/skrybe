<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Skrybe</title>
    <base href="./">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #app-root {
        height: 100%;
      }
      .response-content {
        text-align: left;
        line-height: 1.6;
      }
      .response-content h1, .response-content h2, .response-content h3 {
        margin-top: 1em;
        margin-bottom: 0.5em;
      }
      .response-content p {
        margin: 0.5em 0;
      }
      .response-content ul, .response-content ol {
        margin: 0.5em 0;
        padding-left: 1.5em;
      }
      .response-content li {
        margin: 0.25em 0;
      }
      .response-content code {
        background: #f4f4f4;
        padding: 0.2em 0.4em;
        border-radius: 3px;
        font-family: monospace;
      }
      .response-content pre {
        background: #f4f4f4;
        padding: 1em;
        border-radius: 5px;
        overflow-x: auto;
      }
      .response-content pre code {
        background: none;
        padding: 0;
      }
      .response-content blockquote {
        border-left: 3px solid #ddd;
        margin: 0.5em 0;
        padding-left: 1em;
        color: #666;
      }
      .response-content a {
        color: #0066cc;
      }
    </style>
  </head>
  <body>
    <div id="app-root"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
