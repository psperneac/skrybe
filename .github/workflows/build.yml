name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed files
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'src/**'
              - 'electron.vite.config.ts'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'

      - name: Setup Node
        uses: actions/setup-node@v4
        if: steps.changed.outputs.src == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        if: steps.changed.outputs.src == 'true'
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.changed.outputs.src == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        if: steps.changed.outputs.src == 'true'
        run: npm run build

      - name: Upload artifacts
        if: steps.changed.outputs.src == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-ubuntu
          path: out/
          retention-days: 7
